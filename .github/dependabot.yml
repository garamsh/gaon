version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /apiserver
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /controllers
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /gaon-cli
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /lib/api
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /lib/plugin
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /network-default
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /node-agent
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /scheduler
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /storage-local
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /etcd-snapshot
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /dns
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /etcd-snapshot
    schedule:
      interval: weekly
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
