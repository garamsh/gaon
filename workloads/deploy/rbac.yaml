# What gaon-workloads is allowed, applied by an administrator with
# `gaon apply -f workloads/deploy/rbac.yaml`. The unit's certificate has the
# common name gaon-workloads, which the binding names. The unit registers the
# Job and CronJob kinds itself (ADR 0024, ADR 0025), so it may create and update
# the definitions it labels, write the MicroVMs it labels, and create and delete
# the Jobs it labels, which it makes for a CronJob's scheduled times. It acts only while it holds the
# coordination Lease gaon-workloads (ADR 0024 Errata, ADR 0023), which it reads,
# creates and renews.
apiVersion: rbac.gaon.garam.sh/v1alpha1
kind: ClusterRole
metadata:
  name: gaon:workloads
rules:
  - apiGroups: [apiextensions.gaon.garam.sh]
    resources: [customresourcedefinitions]
    verbs: [create, update]
    labelSelector: workloads.gaon.garam.sh/managed-by=gaon-workloads
  - apiGroups: [apiextensions.gaon.garam.sh]
    resources: [customresourcedefinitions]
    verbs: [get]
  - apiGroups: [compute.gaon.garam.sh]
    resources: [microvms]
    verbs: [create, get, list]
    labelSelector: workloads.gaon.garam.sh/managed-by=gaon-workloads
  - apiGroups: [coordination.gaon.garam.sh]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [workloads.gaon.garam.sh]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [workloads.gaon.garam.sh]
    resources: [jobs/status]
    verbs: [update]
  - apiGroups: [workloads.gaon.garam.sh]
    resources: [jobs]
    verbs: [create, delete]
    labelSelector: workloads.gaon.garam.sh/managed-by=gaon-workloads
  - apiGroups: [workloads.gaon.garam.sh]
    resources: [cronjobs]
    verbs: [list]
  - apiGroups: [workloads.gaon.garam.sh]
    resources: [cronjobs/status]
    verbs: [update]
---
apiVersion: rbac.gaon.garam.sh/v1alpha1
kind: ClusterRoleBinding
metadata:
  name: gaon:workloads
roleRef:
  kind: ClusterRole
  name: gaon:workloads
subjects:
  - kind: User
    name: gaon-workloads
