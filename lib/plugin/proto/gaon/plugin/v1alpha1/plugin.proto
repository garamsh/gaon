// The gaon plugin API, version v1alpha1: how the Node Agent asks a network
// plugin and a storage plugin, each a process of its own on a Unix socket,
// before it creates a MicroVM. Its meaning is fixed by
// docs/architecture/node-agent.md §Plugins; this file is the encoding.
syntax = "proto3";

package gaon.plugin.v1alpha1;

option go_package = "github.com/garamsh/gaon/lib/plugin/v1alpha1;pluginv1alpha1";

// Refusal is a plugin's verdict that it does not serve a MicroVM, and never
// will. The agent fails the MicroVM with the reason and the message and does
// not retry. An error of the call is not a verdict: the agent retries it.
message Refusal {
  // A CamelCase reason, which becomes the Ready condition's reason.
  string reason = 1;
  string message = 2;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
  PROTOCOL_ICMP = 3;
  PROTOCOL_ICMPV6 = 4;
  PROTOCOL_ANY = 5;
}

// PortRange is the ports first to last, both included.
message PortRange {
  uint32 first = 1;
  uint32 last = 2;
}

// NetworkRule is one entry of a policy's egress or ingress list: a packet
// passes if any rule of its direction matches.
message NetworkRule {
  // An IPv4 prefix (a.b.c.d/n) or an IPv6 prefix (x:x::/n).
  string prefix = 1;
  Protocol protocol = 2;
  // Empty means every port; only TCP and UDP rules may set it.
  repeated PortRange ports = 3;
}

// NetworkPolicy is what a MicroVM is created with. An empty policy blocks all
// traffic to and from outside the node.
message NetworkPolicy {
  repeated NetworkRule egress = 1;
  repeated NetworkRule ingress = 2;
}

// DiskAttachment is one disk the node holds, attached to a MicroVM.
message DiskAttachment {
  string disk_id = 1;
  bool read_only = 2;
}

// NetworkService is served by a network plugin.
service NetworkService {
  // Policy returns the policy a MicroVM is created with.
  rpc Policy(PolicyRequest) returns (PolicyResponse);
  // Enforce makes the node enforce exactly the limits in the request,
  // replacing those of an earlier call. It is repeatable.
  rpc Enforce(EnforceRequest) returns (EnforceResponse);
  // Expose makes the node translate the addresses in the request to their
  // backends and answer for the LAN addresses in it, replacing an earlier
  // call. It is repeatable.
  rpc Expose(ExposeRequest) returns (ExposeResponse);
}

message PolicyRequest {
  // The MicroVM, as the JSON of the resource API's v1alpha1 MicroVM.
  bytes microvm = 1;
}

message PolicyResponse {
  // Set when the plugin does not serve the MicroVM; policy is then unset.
  Refusal refusal = 1;
  NetworkPolicy policy = 2;
}

// PolicyPort is a protocol and a port number a limit allows.
message PolicyPort {
  // PROTOCOL_TCP or PROTOCOL_UDP.
  Protocol protocol = 1;
  uint32 port = 2;
}

// Allow is one entry of a limit: traffic passes if any entry of the limit
// matches the address of the other end and the destination port.
message Allow {
  // An IPv4 or IPv6 prefix; empty means every address.
  string prefix = 1;
  // Prefixes inside prefix whose addresses do not match.
  repeated string except = 2;
  // Empty means every port and protocol.
  repeated PolicyPort ports = 3;
}

// Limit restricts a direction of a MicroVM's traffic to what its entries
// allow. No entry allows nothing.
message Limit {
  repeated Allow allow = 1;
}

// MicroVMLimits are the limits NetworkPolicy puts on one MicroVM of the node.
// A direction whose limit is unset is unrestricted.
message MicroVMLimits {
  string microvm = 1;
  // The MicroVM's addresses; the limits apply to traffic to and from them.
  repeated string addresses = 2;
  Limit ingress = 3;
  Limit egress = 4;
}

message EnforceRequest {
  // Every MicroVM of the node that NetworkPolicy limits. One absent from it
  // is unrestricted by NetworkPolicy.
  repeated MicroVMLimits microvms = 1;
}

message EnforceResponse {}

message ExposeRequest {
  // Every address the node translates. A packet to an address and port that
  // no route names is not translated.
  repeated Route routes = 1;
  // The LAN addresses the node answers for, as ARP for IPv4 and NDP for
  // IPv6. One absent from it is not answered for.
  repeated string announce = 2;
}

// Route sends the connections to one port of an address to its backends.
message Route {
  // The name of the Service the route is for, for messages.
  string service = 1;
  string address = 2;
  Protocol protocol = 3;
  uint32 port = 4;
  // The backends that are ready. A route with none refuses connections.
  repeated Backend backends = 5;
  // Set when the address is a LAN address, so connections from outside the
  // cluster come back through this node.
  bool lan = 6;
}

message Backend {
  string address = 1;
  uint32 port = 2;
}

message ExposeResponse {}

// StorageService is served by a storage plugin.
service StorageService {
  // Attach readies the MicroVM's volumes and returns its disks. It is
  // repeatable for the same MicroVM and epoch.
  rpc Attach(AttachRequest) returns (AttachResponse);
  // Release gives back what Attach readied for an mvmd machine identifier. It
  // is repeatable and is also called for an identifier Attach never saw.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

message AttachRequest {
  // The MicroVM, as the JSON of the resource API's v1alpha1 MicroVM.
  bytes microvm = 1;
}

message AttachResponse {
  // Set when the plugin does not serve the MicroVM; disks is then empty.
  Refusal refusal = 1;
  repeated DiskAttachment disks = 2;
}

message ReleaseRequest {
  string machine_id = 1;
}

message ReleaseResponse {}
