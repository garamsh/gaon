apiVersion: workloads.gaon.garam.sh/v1alpha1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    image: {{ .Values.image }}
    rootDiskSize: 256Mi
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
